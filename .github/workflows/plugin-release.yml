# Releases a plugin version from a production branch, and keeps its changelog date right first.
#
# The caller owns the triggers, and the event picks the job:
# - a pull request into N.x-prod runs the changelog date check, which is meant to be required,
#   and opens a pull request dating the entry on the pull request's head branch when it is not;
# - a push to N.x-prod tags the version in plugin.json and publishes its GitHub Release;
# - workflow_dispatch runs the task named by the task input on its own.
# Nothing here pushes to a protected branch: every change to CHANGELOG.md goes through a pull request.

name: Plugin release

on:
  workflow_call:
    inputs:
      script-ref:
        description: "Ref of matomo-org/plugin-ci-workflows to take the release script from. This is this repository, so the workflow SHA is the right value when pinning."
        required: false
        type: string
        default: 'main'
      task:
        description: "For workflow_dispatch: release, changelog-check or changelog-date. Other events ignore it."
        required: false
        type: string
        default: 'release'
      release-date:
        description: "For the changelog-date task: the date to write, as YYYY-MM-DD. Defaults to today in UTC."
        required: false
        type: string
        default: ''

permissions: {}

concurrency:
  group: plugin-release-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check-date:
    name: Changelog date
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.task == 'changelog-check')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out the release script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: matomo-org/plugin-ci-workflows
          ref: ${{ inputs.script-ref }}
          path: .plugin-ci-workflows-${{ github.run_id }}-${{ github.run_attempt }}
          persist-credentials: false

      - name: Check the changelog date
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SCRIPT_CHECKOUT: .plugin-ci-workflows-${{ github.run_id }}-${{ github.run_attempt }}
        shell: bash
        run: |
          set -euo pipefail
          # A private plugin's tags can only be listed with the token.
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=credential.https://github.com.helper
          export GIT_CONFIG_VALUE_0="!f() { echo username=x-access-token; echo \"password=\$GITHUB_TOKEN\"; }; f"
          bash "$SCRIPT_CHECKOUT/scripts/bash/check_plugin_changelog_date.sh"

  date-pr:
    name: Release date pull request
    # A fork's branch can't take a pull request from this repository's token, and a release date
    # pull request would be proposed for its own branch.
    if: >-
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        && !startsWith(github.event.pull_request.head.ref, 'automated/release-date-'))
      || (github.event_name == 'workflow_dispatch' && inputs.task == 'changelog-date')
    runs-on: ubuntu-24.04
    permissions:
      contents: write # push automated/release-date-<version>
      pull-requests: write # open the pull request that merges it
    timeout-minutes: 10
    env:
      TARGET_BRANCH: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TARGET_BRANCH }}
          persist-credentials: false

      - name: Check out the release script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: matomo-org/plugin-ci-workflows
          ref: ${{ inputs.script-ref }}
          path: .plugin-ci-workflows-${{ github.run_id }}-${{ github.run_attempt }}
          persist-credentials: false

      - name: Open the release date pull request
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_DATE: ${{ inputs.release-date }}
          SCRIPT_CHECKOUT: .plugin-ci-workflows-${{ github.run_id }}-${{ github.run_attempt }}
        shell: bash
        run: |
          set -euo pipefail
          # git asks the helper, which reads the runner-masked token itself, so no value derived from
          # the token reaches the environment and needs masking.
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=credential.https://github.com.helper
          export GIT_CONFIG_VALUE_0="!f() { echo username=x-access-token; echo \"password=\$GITHUB_TOKEN\"; }; f"
          bash "$SCRIPT_CHECKOUT/scripts/bash/open_plugin_changelog_date_pr.sh" "$TARGET_BRANCH" "$RELEASE_DATE"

  release:
    name: Build release
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.task == 'release')
    runs-on: ubuntu-24.04
    permissions:
      contents: write # create the tag and publish the release, or push the release date branch
      pull-requests: write # open the release date pull requests when the changelog date is stale
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check out the release script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: matomo-org/plugin-ci-workflows
          ref: ${{ inputs.script-ref }}
          path: .plugin-ci-workflows-${{ github.run_id }}-${{ github.run_attempt }}
          persist-credentials: false

      # The guard fails closed without PyYAML; see plugin-ci.yml for why the install is conditional.
      - name: Install the YAML parser the guard needs
        shell: bash
        run: python3 -c 'import yaml' || { sudo apt-get update && sudo apt-get install -y --no-install-recommends python3-yaml; }

      - name: Check caller concurrency
        env:
          SCRIPT_CHECKOUT: .plugin-ci-workflows-${{ github.run_id }}-${{ github.run_attempt }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
        shell: bash
        run: |
          set -euo pipefail
          bash "$SCRIPT_CHECKOUT/scripts/bash/check_caller_concurrency.sh" \
            "$WORKFLOW_REF" "$GITHUB_WORKSPACE" \
            "plugin-ci-workflows/.github/workflows/plugin-release.yml"

      - name: Fetch current production branch
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          # git asks the helper, which reads the runner-masked token itself, so no value derived from
          # the token reaches the environment and needs masking.
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=credential.https://github.com.helper
          export GIT_CONFIG_VALUE_0="!f() { echo username=x-access-token; echo \"password=\$GITHUB_TOKEN\"; }; f"
          git fetch --no-tags origin \
            "refs/heads/$GITHUB_REF_NAME:refs/remotes/origin/$GITHUB_REF_NAME"

      - name: Prepare release
        id: prepare
        env:
          SCRIPT_CHECKOUT: .plugin-ci-workflows-${{ github.run_id }}-${{ github.run_attempt }}
        shell: bash
        run: |
          set -euo pipefail
          bash "$SCRIPT_CHECKOUT/scripts/bash/prepare_plugin_release.sh" plugin.json "$GITHUB_REF_NAME"

      - name: Stage release scripts
        env:
          SCRIPT_CHECKOUT: .plugin-ci-workflows-${{ github.run_id }}-${{ github.run_attempt }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/release-scripts/bash" "$RUNNER_TEMP/release-scripts/python"
          cp "$SCRIPT_CHECKOUT/scripts/python/update_changelog_date.py" "$RUNNER_TEMP/release-scripts/python/"
          cp "$SCRIPT_CHECKOUT/scripts/bash/create_plugin_release_tag.sh" \
            "$SCRIPT_CHECKOUT/scripts/bash/publish_plugin_release.sh" \
            "$SCRIPT_CHECKOUT/scripts/bash/open_plugin_changelog_date_pr.sh" \
            "$RUNNER_TEMP/release-scripts/bash/"
          # Keep the shared checkout out of the plugin repository before git records the release.
          rm -rf "$SCRIPT_CHECKOUT"

      - name: Open release date pull requests
        if: steps.prepare.outputs.date_pr_needed == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.prepare.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=credential.https://github.com.helper
          export GIT_CONFIG_VALUE_0="!f() { echo username=x-access-token; echo \"password=\$GITHUB_TOKEN\"; }; f"
          bash "$RUNNER_TEMP/release-scripts/bash/open_plugin_changelog_date_pr.sh" "$GITHUB_REF_NAME"
          echo "::error file=CHANGELOG.md::$VERSION was not released because its changelog entry is not dated today. Merge the release date pull requests opened above, and the merge into $GITHUB_REF_NAME releases it."
          exit 1

      - name: Create release tag
        if: steps.prepare.outputs.release_needed == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.prepare.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=credential.https://github.com.helper
          export GIT_CONFIG_VALUE_0="!f() { echo username=x-access-token; echo \"password=\$GITHUB_TOKEN\"; }; f"
          bash "$RUNNER_TEMP/release-scripts/bash/create_plugin_release_tag.sh" "$VERSION" "$GITHUB_REF_NAME"

      - name: Create GitHub release
        if: steps.prepare.outputs.publish_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PLUGIN_NAME: ${{ steps.prepare.outputs.plugin_name }}
          RELEASE_DATE: ${{ steps.prepare.outputs.release_date }}
          VERSION: ${{ steps.prepare.outputs.version }}
          PUBLISH_SCRIPT: ${{ runner.temp }}/release-scripts/bash/publish_plugin_release.sh
        shell: bash
        run: |
          set -euo pipefail
          bash "$PUBLISH_SCRIPT" "$PLUGIN_NAME" "$VERSION" "$RELEASE_DATE"
